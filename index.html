:root[data-theme="dark"]{--bg:#081315;--fg:#edf8f7;--card:#102022;--mut:#91a9ab;--ac:#42d0c5;--ac2:#76e2d5;--bd:#263b3e}

/* ===== MASCOT / CHARACTER SYSTEM ===== */
#buddy{position:relative;display:grid;grid-template-columns:86px 1fr;gap:12px;align-items:center;margin:0 0 12px;padding:12px 14px;border:1px solid var(--bd);border-radius:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--card) 94%,var(--ac) 6%),var(--card));box-shadow:var(--shadow2);overflow:hidden}
#buddy:before{content:"";position:absolute;width:170px;height:170px;right:-90px;top:-90px;border-radius:50%;background:color-mix(in srgb,var(--gold) 10%,transparent);pointer-events:none}
.buddy-copy{position:relative;z-index:1;min-width:0}.buddy-name{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:850;color:var(--ac);margin-bottom:2px}.buddy-say{font-size:14px;font-weight:750;line-height:1.25}.buddy-meta{font-size:11px;color:var(--mut);margin-top:4px}

/* ===== CHARACTER CHOICES / WARDROBE ===== */
.character-choice{margin:0 0 14px;padding:12px;border:1px solid var(--bd);border-radius:18px;background:color-mix(in srgb,var(--card) 94%,var(--ac) 6%)}
.choice-title{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);margin-bottom:9px}.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choice{border:1px solid var(--bd);background:var(--card);border-radius:14px;padding:10px;cursor:pointer;text-align:left;transition:.18s}.choice:hover{transform:translateY(-1px);box-shadow:var(--shadow2)}.choice.selected{border-color:var(--ac);box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 18%,transparent)}.choice-icon{font-size:24px}.choice-name{font-size:12px;font-weight:900;margin-top:3px}.choice-desc{font-size:10px;color:var(--mut);margin-top:2px}.wardrobe-slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.slot{padding:8px;border:1px solid var(--bd);border-radius:13px;background:var(--card);text-align:center}.slot b{display:block;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}.slot span{display:block;font-size:18px;margin-top:4px}.style-scholar .buddy-body{background:linear-gradient(135deg,#4768d8,#7895ff)}.style-explorer .buddy-body{background:linear-gradient(135deg,#198b65,#4bc98d)}.style-challenger .buddy-body{background:linear-gradient(135deg,#b64b35,#f07b4f)}.style-scholar .buddy-badge:before{content:'📚'}.style-explorer .buddy-badge:before{content:'🧭'}.style-challenger .buddy-badge:before{content:'⚔️'}.style-scholar .buddy-badge,.style-explorer .buddy-badge,.style-challenger .buddy-badge{font-size:0}.style-scholar .buddy-badge:before,.style-explorer .buddy-badge:before,.style-challenger .buddy-badge:before{font-size:9px}.choice-note{font-size:11px;color:var(--mut);margin-top:8px}

/* ===== XP COSMETICS SHOP ===== */
#shopBtn{font-size:13px;font-weight:850}

@media(max-width:520px){.shop-grid{grid-template-columns:1fr}.shop-head{align-items:center}.xp-wallet{font-size:12px;padding:8px 10px}}



/* ===== MONSTER AVATAR ===== */
.buddy-art{position:relative;width:76px;height:76px}
.buddy-art svg{width:100%;height:100%;overflow:visible;animation:mIdle 2.4s ease-in-out infinite}.buddy-art svg.rb{animation:mIdle 2.4s ease-in-out infinite,rb 5s linear infinite}

.face g{display:none}#buddy .e-n,#buddy .m-n,.shop-preview .e-n,.shop-preview .m-n{display:inline}
#buddy.happy .e-n,#buddy.happy .m-n,#buddy.sad .e-n,#buddy.sad .m-n,#buddy.excited .e-n,#buddy.excited .m-n,#buddy.winner .e-n,#buddy.winner .m-n{display:none}
#buddy.happy .e-h,#buddy.happy .m-h,#buddy.sad .e-s,#buddy.sad .m-s,#buddy.excited .e-x,#buddy.excited .m-x,#buddy.winner .e-x,#buddy.winner .m-h{display:inline}
#buddy.happy .buddy-art svg{animation:mHop .6s ease}#buddy.sad .buddy-art svg{animation:mShake .9s ease;filter:saturate(.75)}#buddy.excited .buddy-art svg{animation:mJig .7s ease 2}#buddy.winner .buddy-art svg{animation:mSpin 1s ease}
#buddy.evolve .buddy-art svg{animation:mEvo 1.3s ease}

@keyframes mIdle{50%{transform:translateY(-3px)}}@keyframes mHop{40%{transform:translateY(-12px) scale(1.06,.94)}}@keyframes mShake{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
@keyframes mJig{20%{transform:translateY(-12px) rotate(-9deg)}60%{transform:translateY(-12px) rotate(9deg)}}@keyframes mSpin{50%{transform:translateY(-16px) rotate(180deg) scale(1.1)}100%{transform:rotate(360deg)}}
@keyframes mEvo{0%{filter:brightness(1)}35%{filter:brightness(8) saturate(0);transform:scale(1.25)}100%{filter:brightness(1)}}@keyframes rb{to{filter:hue-rotate(360deg)}}@keyframes tw{to{transform:translateY(-4px) scale(1.15);opacity:.6}}

<script>

 document.getElementById("xh").onclick=()=>{if(over||lock[sel.r][sel.c])return;G.xp=Math.max(0,G.xp-3);const g=gs(cur);g.xp=Math.max(0,g.xp-3);save();hdr();toast("−3 XP");setCh(sel.r,sel.c,sol[sel.r][sel.c],1);step(1);paint()};
 document.getElementById("xn").onclick=xw;
 if(TS())tstart(TS()*WD.length*4,()=>finish(false));
 paint();foc();
}
/* WOORD REGEN */
function wr(){
 tstop();
 const cand=pool(VOC).filter(x=>EN[x.w]&&x.w.length>=3&&x.w.length<=14);
 if(cand.length<4){h(`<div class="sc"><span>Woord Regen</span>${chSel()}</div><div class="msg">Te weinig woorden hier. Kies “Alle thema's”.</div>`);bindCh();return}
 let lives=3,score=0,cleared=0,over=false,words=[],missed=[],sp=0;const H=320,base=[16,20,16,12][T];
 h(`<div class="sc"><span id="rl"></span><span id="rs"></span>${chSel()}</div>
 <div class="ar" id="ar"><div class="ov" id="ov"><div>Typ het Duitse woord voordat het de grond raakt.</div><button class="b" id="st">▶ Start</button></div></div>
 <input id="ri" placeholder="Typ het Duitse woord…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="margin-top:10px;font-size:16px">
 <div class="msg" id="rm"></div><div class="row"><button class="b" id="rn">Opnieuw</button></div>`);
 bindCh();const ar=document.getElementById("ar"),ri=document.getElementById("ri"),rm=document.getElementById("rm");
 const lvl=()=>1+(cleared/5|0),upd=()=>{document.getElementById("rl").textContent="❤️".repeat(Math.max(0,lives));document.getElementById("rs").textContent="Score: "+score+" · Snelheid "+lvl()};
 function spawn(){
  if(words.length>=7)return;let o,t=0;do{o=pick(cand);t++}while(words.some(x=>x.w==o.w)&&t<8);if(words.some(x=>x.w==o.w))return;
  const el=document.createElement("div");el.className="fw";el.textContent=EN[o.w]+" ("+o.w.length+")";ar.appendChild(el);
  el.style.left=Math.random()*Math.max(0,ar.clientWidth-el.offsetWidth)+"px";el.style.top="0px";words.push({w:o.w,en:EN[o.w],y:0,el})}
 function miss(w){words.splice(words.indexOf(w),1);w.el.remove();lives--;bad();rec("v:"+w.w,0);if(!missed.some(m=>m.w==w.w))missed.push(w);rm.textContent="✗ "+w.w+" = "+w.en;upd();if(lives<=0)end()}
 function hit(w){words.splice(words.indexOf(w),1);w.el.remove();score++;cleared++;good(8);rec("v:"+w.w,1);ri.value="";rm.textContent="✓ "+w.w;upd();if(cleared%5==0)toast("⚡ Sneller!")}
 function end(){
  over=true;tstop();if(score>(G.wb||0)){G.wb=score;save()}if(score>=10)won();
  ar.insertAdjacentHTML("beforeend",`<div class="ov">${sOver()||""}<div class="big">💀</div><b>Game over</b><div>Score: ${score} · Record: ${G.wb||0}</div></div>`);
  rm.innerHTML=missed.length?`<div class="sc" style="justify-content:center">Gemist:</div>`+missed.map(m=>`<div class="it"><span>${esc(m.w)}</span><span>${esc(m.en)}</span></div>`).join(""):""}
 function tick(){
  if(over)return;sp+=50;if(sp>=Math.max(1300,4200-lvl()*200)){sp=0;spawn()}
  const dy=H/(Math.max(4,base-lvl()*.7)*20);
  [...words].forEach(w=>{w.y+=dy;w.el.style.top=w.y+"px";if(w.y>=H-30&&!over)miss(w)})}
 ri.oninput=()=>{if(over)return;const n1=z=>z.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ß/g,"ss"),n2=z=>z.replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss"),r=ri.value.trim().toLowerCase(),v=n1(r),v2=n2(r),m=words.find(x=>n1(x.w)==v||n2(x.w)==v2);if(m&&v){hit(m);return}words.forEach(x=>x.el.classList.toggle("hl",!!v&&(n1(x.w).startsWith(v)||n2(x.w).startsWith(v2))))};
 ri.onkeydown=e=>{if(e.key=="Enter")ri.value=""};
 document.getElementById("st").onclick=()=>{document.getElementById("ov").remove();spawn();TM.id=setInterval(tick,50);ri.focus()};
 document.getElementById("rn").onclick=wr;upd();
}
/* MIJN WOORDEN */
let MY={v:[],p:[],i:[],sy:[],ov:{}},mt="v",mmsg="",edq="";
try{MY=Object.assign(MY,JSON.parse(localStorage.getItem("wd_my")||"{}"))}catch(e){}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rebuild(){
 [VOC,PR,IDI,ALL,SYN].forEach(a=>{for(let i=a.length-1;i>=0;i--)if(a[i].my)a.splice(i,1)});
 if(!rebuild.b)rebuild.b={...EN};for(const k in EN)if(!(k in rebuild.b))delete EN[k];Object.assign(EN,rebuild.b);
 MY.v.forEach(x=>{VOC.push({w:x.w,c:9,my:1,a:x.a||undefined});EN[x.w]=x.en+(x.a?" · "+x.a:"");if(x.s)ALL.push({s:x.s,c:7,w:x.w,my:1})});
 MY.p.forEach(x=>PR.push({t:x.t,p:x.p,c:9,my:1}));
 MY.i.forEach(x=>IDI.push({t:x.t,m:x.m,c:9,my:1}));
 MY.sy.forEach(x=>SYN.push({w:x.w,y:x.y,c:9,my:1}));
 for(const k in MY.ov){const v=VOC.find(x=>x.w==k);if(v)EN[k]=MY.ov[k]+(v.a?" · "+v.a:"")}
}
function addRow(a){a=a.map(x=>(x||"").trim());if(!a[0]||!a[1])return 0;
 if(mt=="v"){let w=a[0].toLowerCase(),ar=(a[2]||"").toLowerCase(),s=a[3]||"";
  const m=w.match(/^(der|die|das)\s+(\S.*)$/)||w.match(/^([\^~])\s*(\S.*)$/);if(m){w=m[2];if(!ar)ar=m[1]}
  if(!["der","die","das"].includes(ar))ar="";
  const o=MY.v.find(x=>x.w==w);if(o){o.en=a[1];if(ar)o.a=ar;if(s)o.s=s}else MY.v.push({w,en:a[1],s,a:ar})}
 else if(mt=="p")MY.p.push({t:a[0],p:a[1].toLowerCase()});
 else if(mt=="s")MY.sy.push({w:a[0].toLowerCase(),y:a[1].split(/[\/,]/).map(x=>x.trim().toLowerCase()).filter(Boolean)});
 else MY.i.push({t:a[0],m:a[1]});return 1}
function persist(){try{localStorage.setItem("wd_my",JSON.stringify(MY))}catch(e){}rebuild()}
function mine(){
 const L={v:["Duits woord","Nederlands","Lidwoord: der, die of das (optioneel)","Voorbeeldzin (optioneel)"],p:["Werkwoord (bv. warten)","Voorzetsel (bv. auf)"],i:["Idioom","Betekenis"],s:["Woord","Synoniem(en), gescheiden door /"]}[mt];
 const show=x=>mt=="v"?`${x.a?esc(x.a)+" ":""}${esc(x.w)} = ${esc(x.en)}${x.s?" · "+esc(x.s):""}`:mt=="p"?`${esc(x.t)} <b>${esc(x.p)}</b>`:mt=="s"?`${esc(x.w)} ≈ ${esc(x.y.join(" / "))}`:`${esc(x.t)} = ${esc(x.m)}`;
 h(`<div class="sc"><span>Mijn lijst: ${MY.v.length} woorden · ${MY.p.length} voorzetsels · ${MY.i.length} idiomen · ${MY.sy.length} synoniemen</span></div>
 <div class="sc">Je woorden doen mee bij “Alle thema's” en bij “Mijn woorden” in elk spel.</div>
 <select id="mt" style="margin-bottom:8px"><option value="v">Woord</option><option value="p">Werkwoord + voorzetsel</option><option value="i">Idioom</option><option value="s">Synoniem</option></select>
 ${L.map((x,n)=>`<input id="f${n}" placeholder="${x}">`).join("")}
 <div class="row" style="margin:0 0 12px"><button class="b" id="add">+ Toevoegen</button></div>
 <textarea id="bulk" placeholder="Meerdere tegelijk, één per regel, gescheiden door =  (bv. vermeiden = vermijden  of  die Gesellschaft = samenleving)"></textarea>
 <div class="row" style="margin:0 0 6px"><button class="b" id="bk">Lijst toevoegen</button></div>
 <div class="msg">${mmsg}</div>
 <div>${MY[mt=="s"?"sy":mt].map((x,n)=>`<div class="it"><span>${show(x)}</span><button class="b" data-d="${n}">✕</button></div>`).join("")}</div>
 <div class="sc" style="margin-top:14px"><b>Definities bewerken</b></div><input id="eds" placeholder="Zoek een woord of vertaling…" value="${esc(edq)}"><div id="edl"></div>
 <textarea id="bak" style="margin-top:12px" placeholder="Back-up: Exporteer om te kopiëren, plak hier en klik Importeer op een ander apparaat"></textarea>
 <div class="row" style="margin-top:0"><button class="b" id="ex">Exporteer</button><button class="b" id="im">Importeer</button></div>`);
 const sel=document.getElementById("mt");sel.value=mt;sel.onchange=()=>{mt=sel.value;mmsg="";mine()};
 document.getElementById("add").onclick=()=>{const ok=addRow(L.map((_,n)=>document.getElementById("f"+n).value));mmsg=ok?"✓ Toegevoegd":"Vul minstens de eerste twee velden in.";persist();mine()};
 document.getElementById("bk").onclick=()=>{let n=0;document.getElementById("bulk").value.split("\n").forEach(l=>{let q=l.split("=");if(mt=="v"&&q.length>=3&&!/^\s*(der|die|das|\^|~)\s*$/i.test(q[2]))q=[q[0],q[1],"",q.slice(2).join("=")];n+=addRow(q)});mmsg="✓ "+n+" toegevoegd";persist();mine()};
 app.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{MY[mt=="s"?"sy":mt].splice(+b.dataset.d,1);persist();mine()});
 document.getElementById("ex").onclick=()=>{const t=JSON.stringify({...MY,pg:PG,gx:G.gx,xp:G.xp,spent:G.spent,shop:G.shop});document.getElementById("bak").value=t;try{navigator.clipboard.writeText(t)}catch(e){}};
 document.getElementById("im").onclick=()=>{try{const o=JSON.parse(document.getElementById("bak").value);["v","p","i","sy"].forEach(k=>(Array.isArray(o[k])?o[k]:[]).forEach(x=>{if(x&&typeof x=="object"&&!MY[k].some(y=>JSON.stringify(y)==JSON.stringify(x)))MY[k].push(x)}));if(o.ov&&typeof o.ov=="object")Object.assign(MY.ov,o.ov);if(o.pg){Object.assign(PG.kn,o.pg.kn||{});for(const k in o.pg.st||{}){const a=PG.st[k],b=o.pg.st[k];if(!a||b.c+b.w>a.c+a.w)PG.st[k]=b}savePG()}if(o.gx){for(const k in o.gx){if(!G.gx[k]||o.gx[k].xp>G.gx[k].xp)G.gx[k]=o.gx[k]}if(o.xp>G.xp)G.xp=o.xp;if(typeof o.spent==="number"&&o.spent<G.spent)G.spent=o.spent;if(o.shop&&Array.isArray(o.shop.owned)){G.shop.owned=[...new Set([...(G.shop.owned||[]),...o.shop.owned])];G.shop.equipped=Object.assign(G.shop.equipped||{},o.shop.equipped||{})}save();hdr();applyCharacter()}mmsg="✓ Geïmporteerd"}catch(e){mmsg="Ongeldige back-up."}persist();mine()};
 const es=document.getElementById("eds");es.oninput=()=>{edq=es.value;renderEd()};renderEd();
 hdr();
}
function renderEd(){
 const q=edq.trim().toLowerCase(),box=document.getElementById("edl");if(!box)return;
 const f=q?VOC.filter(x=>x.w.includes(q)||(EN[x.w]||"").toLowerCase().includes(q)):[];
 box.innerHTML=(q?"":'<div class="sc">Typ om te zoeken (max. 25 resultaten).</div>')+f.slice(0,25).map(x=>`<div class="it" style="display:block"><b>${x.a?x.a+" ":""}${esc(D(x))}</b><div class="row" style="margin:4px 0 0;flex-wrap:nowrap"><input data-ew="${esc(x.w)}" value="${esc((EN[x.w]||"").replace(ARX,""))}" style="margin:0"><button class="b" data-er="${esc(x.w)}" title="Terugzetten" ${MY.ov[x.w]?"":"disabled"}>↩</button></div></div>`).join("");
 box.querySelectorAll("[data-ew]").forEach(i=>i.onchange=()=>{const v=i.value.trim();if(!v)return;MY.ov[i.dataset.ew]=v;persist();i.closest(".it").querySelector("[data-er]").disabled=false;toast("✓ Definitie opgeslagen")});
 box.querySelectorAll("[data-er]").forEach(b=>b.onclick=()=>{delete MY.ov[b.dataset.er];persist();toast("↩ Teruggezet");renderEd()})}
rebuild();hdr();go("Galgje");
buddyRefresh();applyCharacter();
applyCharacter(); characterHome();
</script>
